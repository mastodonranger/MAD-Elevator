<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MAD ELEVATOR">
<meta name="theme-color" content="#0A0C11">
<meta name="description" content="MAD Elevator - a cel-shaded monochrome endless climb. Steer a red elevator car out of the city and into the dark.">
<title>MAD ELEVATOR</title>
<style>
  /* ============================================================
     MAD ELEVATOR
     Monochrome and cel shaded: flat greys, one hard shadow per
     shape, a heavy black outline on everything, and red used for
     exactly three things - the car, the pickups, and the gap you
     are supposed to aim for.
     ============================================================ */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ground:#F4F2ED;
    --ink:#17181C;
    --dim:#C9C6BF;
    --red:#E8433A;
    --red-lo:#7E1410;
    --hard:#0E0E0E;
    --glass:#F2F2F2;
    --sans:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  html,body{height:100%}
  body{
    background:#0A0C11;
    color:var(--ink);
    font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }

  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    width:min(100vw, calc(100dvh * 9 / 16));
    height:min(100dvh, calc(100vw * 16 / 9));
    overflow:hidden;
    background:var(--ground);
    transition:background .6s linear;
    --u:1px;                        /* one world unit */
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .layer{position:absolute;inset:0;pointer-events:none}

  /* ---- HUD: a number, and almost nothing else ---------------- */
  #hud{
    padding:calc(var(--u)*34) calc(var(--u)*32);
    opacity:0;transition:opacity .4s ease;
    color:var(--ink);
  }
  #hud.on{opacity:1}
  #hud,.screen,#zone,.btn{transition:color .5s linear}
  #hud .row{display:flex;align-items:baseline;justify-content:space-between}
  #alt{
    font-size:calc(var(--u)*58);font-weight:300;line-height:1;
    letter-spacing:calc(var(--u)*-2);
    font-variant-numeric:tabular-nums;
  }
  #alt sub{
    font-size:calc(var(--u)*15);font-weight:400;vertical-align:baseline;
    letter-spacing:calc(var(--u)*2);margin-left:calc(var(--u)*8);opacity:.5;
  }
  #best{
    font-size:calc(var(--u)*14);font-weight:400;letter-spacing:calc(var(--u)*2);
    opacity:.45;font-variant-numeric:tabular-nums;text-transform:uppercase;
  }
  #zone{
    position:absolute;left:0;right:0;top:calc(var(--u)*300);
    text-align:center;font-size:calc(var(--u)*15);font-weight:400;
    letter-spacing:calc(var(--u)*7);text-transform:uppercase;
    color:var(--ink);opacity:0;
  }
  #zone.show{animation:zoneIn 2.6s ease forwards}
  @keyframes zoneIn{
    0%{opacity:0;letter-spacing:calc(var(--u)*14)}
    18%{opacity:.62;letter-spacing:calc(var(--u)*7)}
    70%{opacity:.62}
    100%{opacity:0}
  }
  #pwr{
    position:absolute;left:0;right:0;top:calc(var(--u)*118);
    display:flex;justify-content:center;gap:calc(var(--u)*18);
    font-size:calc(var(--u)*13);letter-spacing:calc(var(--u)*3);
    text-transform:uppercase;color:var(--red);
  }
  #pwr span{opacity:0;transition:opacity .2s ease}
  #pwr span.on{opacity:1}

  /* ---- screens ------------------------------------------------ */
  .screen{
    position:absolute;inset:0;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:calc(var(--u)*56);
    color:var(--ink);
  }
  .screen::before{
    content:'';position:absolute;inset:0;z-index:-1;
    background:var(--ground);opacity:.80;
  }
  .screen[hidden]{display:none}
  /* the mark is the car itself, shaded the same way it is in the game */
  .mark{
    width:calc(var(--u)*62);height:calc(var(--u)*92);
    margin-bottom:calc(var(--u)*44);
    position:relative;
    background:var(--red);
    border:calc(var(--u)*5) solid var(--hard);
    box-shadow:inset calc(var(--u)*-17) 0 0 0 var(--red-lo);
  }
  .mark i{
    position:absolute;left:50%;transform:translateX(-50%);
    top:calc(var(--u)*9);
    width:calc(var(--u)*32);height:calc(var(--u)*23);
    background:var(--glass);
    border:calc(var(--u)*4) solid var(--hard);
  }
  .mark::after{
    content:'';position:absolute;
    left:calc(var(--u)*5);right:calc(var(--u)*5);
    bottom:calc(var(--u)*11);height:calc(var(--u)*4);
    background:var(--red-lo);
  }
  h1{
    font-size:calc(var(--u)*40);font-weight:300;line-height:1.1;
    letter-spacing:calc(var(--u)*10);text-transform:uppercase;
  }
  .ver{
    margin-top:calc(var(--u)*14);font-size:calc(var(--u)*13);
    letter-spacing:calc(var(--u)*5);opacity:.4;text-transform:uppercase;
  }
  .lead{
    margin-top:calc(var(--u)*40);font-size:calc(var(--u)*17);
    font-weight:300;line-height:1.9;opacity:.6;max-width:calc(var(--u)*380);
  }
  .go{
    margin-top:calc(var(--u)*52);font-size:calc(var(--u)*15);
    letter-spacing:calc(var(--u)*5);text-transform:uppercase;
    padding-bottom:calc(var(--u)*10);
    border-bottom:calc(var(--u)*2) solid var(--red);
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
  .hint{
    margin-top:calc(var(--u)*42);font-size:calc(var(--u)*13);
    letter-spacing:calc(var(--u)*2);opacity:.35;line-height:2.2;
  }
  @media (prefers-reduced-motion:reduce){ .go{animation:none} #zone.show{animation:none;opacity:.6} }

  /* ---- results ------------------------------------------------ */
  #over{color:var(--glass)}
  #over::before{background:#090909;opacity:1}
  #over .btn{color:var(--glass)}
  #over .num{
    font-size:calc(var(--u)*92);font-weight:200;line-height:1;
    letter-spacing:calc(var(--u)*-4);font-variant-numeric:tabular-nums;
  }
  #over .unit{
    margin-top:calc(var(--u)*16);font-size:calc(var(--u)*13);
    letter-spacing:calc(var(--u)*6);text-transform:uppercase;opacity:.4;
  }
  #cause{
    margin-top:calc(var(--u)*46);font-size:calc(var(--u)*17);
    font-weight:300;opacity:.6;line-height:1.8;max-width:calc(var(--u)*360);
  }
  #rec{
    margin-top:calc(var(--u)*20);font-size:calc(var(--u)*13);
    letter-spacing:calc(var(--u)*5);text-transform:uppercase;color:var(--red);
  }
  #rec[hidden]{display:none}
  .acts{
    margin-top:calc(var(--u)*58);display:flex;flex-direction:column;
    gap:calc(var(--u)*22);pointer-events:auto;
  }
  .btn{
    font-family:var(--sans);font-size:calc(var(--u)*15);font-weight:400;
    letter-spacing:calc(var(--u)*5);text-transform:uppercase;
    background:none;border:0;color:var(--ink);cursor:pointer;
    padding:calc(var(--u)*6) 0;
    border-bottom:calc(var(--u)*2) solid var(--red);
  }
  .btn.quiet{border-bottom-color:transparent;opacity:.4}
  .btn:hover,.btn:focus-visible{opacity:1;outline:none}
  .btn.quiet:hover{border-bottom-color:currentColor}

  /* ---- sound: a single hairline glyph ------------------------- */
  #snd{
    position:absolute;right:calc(var(--u)*30);bottom:calc(var(--u)*30);
    z-index:4;pointer-events:auto;cursor:pointer;
    width:calc(var(--u)*30);height:calc(var(--u)*30);padding:0;
    background:none;border:0;color:var(--ink);opacity:.35;
  }
  #snd:hover,#snd:focus-visible{opacity:.9;outline:none}
  #snd svg{width:100%;height:100%;display:block}
  #snd .x{display:none}
  #snd.off .x{display:block}
  #snd.off .w{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="layer" id="hud">
    <div class="row">
      <div id="alt">0<sub>FT</sub></div>
      <div id="best">Best 0</div>
    </div>
    <div id="pwr"><span id="pShield">VMS3 Activated</span><span id="pBoost">F1 System Speed</span></div>
    <div id="zone"></div>
  </div>

  <div class="screen" id="title">
    <div class="mark"><i></i></div>
    <h1>Mad Elevator</h1>
    <div class="ver">Monochrome</div>
    <div class="lead">Car 3 has left the building.</div>
    <div class="go" id="go">Press Space</div>
    <div class="hint">
      &#8592; &#8594; or A / D<br>
      or hold either side of the screen
    </div>
  </div>

  <div class="screen" id="over" hidden>
    <div class="num" id="fin">0</div>
    <div class="unit">Feet</div>
    <div id="cause">Out of service.</div>
    <div id="rec" hidden>New Best</div>
    <div class="acts">
      <button class="btn" id="again" type="button">Ride Again</button>
      <button class="btn quiet" id="menu" type="button">Menu</button>
    </div>
  </div>

  <button id="snd" type="button" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"></path>
      <g class="w"><path d="M15.5 9.5a4 4 0 0 1 0 5"></path></g>
      <g class="x"><path d="M15.5 10l4 4M19.5 10l-4 4"></path></g>
    </svg>
  </button>
</div>

<script>
(() => {
'use strict';

/* ================================================================
   MAD ELEVATOR v0.3
   A minimalist vertical runner. Everything on screen is a rectangle,
   a circle or a line, drawn as vector geometry at full resolution.
   Three colours are live at any moment: a ground, an ink, and red.
   ================================================================ */

const W = 540, H = 960;
const FT_PER_PX  = 0.30;
const SPEED_MIN  = 150;
const SPEED_MAX  = 820;
const ZONE_TAIL  = 10000;
const STATION    = H * 0.70;
const CAR_W = 34, CAR_H = 52;
const ACCEL = 2100, MAXV = 520, PAD = 30;
const SHIELD_AT = 3200, BOOST_AT = 4400;
const MERCY = 1.2, BOOST_TIME = 2.6, BOOST_RISE = 190, BOOST_MULT = 2.4;
/* crash: jiggle, freeze, the red curtain, then black */
const CRASH_T = 2.18, JIG_T = 0.32, CURTAIN_AT = 0.62, CURTAIN_T = 0.62, BLACK_AT = 1.72;
const RED = '#E8433A';

/* ---- helpers --------------------------------------------------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const rndi  = (a,b) => Math.floor(rnd(a,b+1));
const pick  = a => a[(Math.random()*a.length)|0];
const ease  = t => 1 - Math.pow(1-t, 3);
const commas = n => Math.floor(n).toLocaleString('en-US');
const hx = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mix = (a,b,t) => [lerp(a[0],b[0],t)|0, lerp(a[1],b[1],t)|0, lerp(a[2],b[2],t)|0];
const rgb = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
const hit = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

/* ================================================================
   Palette. Six keyframes; the world inverts on the way up.
   ================================================================ */
/* Monochrome, cel shaded. Only the sky is authored - it runs from paper
   white at street level to black in deep space. Everything drawn on top
   of it holds a fixed contrast so nothing ever disappears into the
   background: buildings are pulled out of the sky toward the ink, cloud
   and moon tones are fixed light, and every hazard is a hard white face
   with a hard near-black shadow and a heavy outline, which reads on a
   white sky and on a black one alike. Red belongs to the car, the
   pickups and the gap in a barrier - nothing else. */
const SKY = [
  { at:0,     c:'#FFFFFF' },
  { at:1600,  c:'#F2F2F2' },
  { at:4000,  c:'#DBDBDB' },
  { at:8000,  c:'#9A9A9A' },
  { at:14000, c:'#2A2A2A' },
  { at:22000, c:'#0C0C0C' }
].map(p => ({ at:p.at, c:hx(p.c) }));

const INK = '#0E0E0E';
const INKRGB = [14,14,14];
const WHITE = [255,255,255];
const RED_LO = '#7E1410', RED_HI = '#FF6A58';
const INK_DARK = '#141414', INK_LIGHT = '#F2F2F2';
const lum = c => (c[0]*0.3 + c[1]*0.59 + c[2]*0.11) / 255;

/* fixed tones */
const HZ_FILL = '#ECECEC', HZ_SHADE = '#232323';   /* hazards  */
const CL_FILL = '#DCDCDC', CL_SHADE = '#A6A6A6';   /* cloud    */
const OR_FILL = '#6E6E6E', OR_SHADE = '#454545';   /* moon     */
const OR_EDGE = '#303030';

const C = { bg:'#FFFFFF', ink:INK, fill:HZ_FILL, shade:HZ_SHADE,
            far:'#C8C8C8', farS:'#9C9C9C', near:'#9C9C9C', nearS:'#6A6A6A',
            dim:'#8A8A8A', ui:INK_DARK, light:true };
let cssBg = '', cssInk = '';
function palette(){
  let i = 0;
  while (i < SKY.length-2 && feet > SKY[i+1].at) i++;
  const a = SKY[i], b = SKY[i+1];
  const t = clamp((feet - a.at) / (b.at - a.at), 0, 1);
  const g = mix(a.c, b.c, t);
  C.light = lum(g) > 0.5;
  C.bg    = rgb(g);
  /* buildings are the sky pulled toward the ink, so they can never match it */
  C.far   = rgb(mix(g, INKRGB, 0.22));
  C.farS  = rgb(mix(g, INKRGB, 0.44));
  C.near  = rgb(mix(g, INKRGB, 0.42));
  C.nearS = rgb(mix(g, INKRGB, 0.62));
  C.dim   = rgb(mix(g, C.light ? INKRGB : WHITE, 0.34));
  C.fill  = HZ_FILL;
  C.shade = HZ_SHADE;
  C.ink   = INK;
  C.ui    = C.light ? INK_DARK : INK_LIGHT;
  if (C.bg !== cssBg){ cssBg = C.bg; stage.style.setProperty('--ground', C.bg); }
  if (C.ui !== cssInk){ cssInk = C.ui; stage.style.setProperty('--ink', C.ui); }
}

/* ================================================================
   Cel shading. Trace a shape once; it gets a flat base, one hard
   shadow polygon cut across it from the lower left, and a heavy
   outline. No gradients anywhere.
   ================================================================ */
const OUTLINE = 4;
/* Trace a shape, give it a flat base, cut one hard shadow across its
   lower half as though the light came from the upper left, and outline
   it. cx,cy is the shape's centre in whatever space it was traced in;
   w,h its full size. */
function cel(build, base, shade, cx, cy, w, h, ow){
  ctx.save();
  build();
  ctx.fillStyle = base; ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.moveTo(cx - w*1.6, cy + h*0.34);
  ctx.lineTo(cx + w*1.6, cy - h*0.10);
  ctx.lineTo(cx + w*1.6, cy + h*2.2);
  ctx.lineTo(cx - w*1.6, cy + h*2.2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  build();
  ctx.lineWidth = ow || OUTLINE; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.restore();
}
/* a wide, short shape is lit from above instead of from the side */
function celBar(x, y, w, h, base, shade, ow){
  const o = ow || OUTLINE;
  ctx.fillStyle = base;  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = shade; ctx.fillRect(x, y + h*0.58, w, h*0.42);
  ctx.lineWidth = o; ctx.strokeStyle = C.ink;
  ctx.strokeRect(x + o/2, y + o/2, w - o, h - o);
}
/* a rectangle gets a vertical shadow band instead of a diagonal */
function celRect(x, y, w, h, base, shade, band, ow){
  const b = band || Math.max(6, w*0.28), o = ow || OUTLINE;
  ctx.fillStyle = base;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = shade;
  ctx.fillRect(x + w - b, y, b, h);
  ctx.lineWidth = o; ctx.strokeStyle = C.ink;
  ctx.strokeRect(x + o/2, y + o/2, w - o, h - o);
}

/* ================================================================
   Zones: five, each a short list of shapes.
   ================================================================ */
const ZONES = [
  { at:0,     name:'Shaft',    mix:[['chevron',1]] },
  { at:1600,  name:'Open Air', mix:[['bar',1],['pendulum',0.7],['chevron',0.5]] },
  { at:4000,  name:'Traffic',  mix:[['capsule',1],['bar',0.55],['chevron',0.3]] },
  { at:8000,  name:'Ascent',   mix:[['circle',1],['capsule',0.5],['square',0.5]] },
  { at:14000, name:'Vacuum',   mix:[['circle',1],['square',0.7],['comet',0.18]] }
];
const NAMES = { chevron:'You hit a bird.', bar:'You hit a barrier.',
                pendulum:'You hit a wrecking ball.', capsule:'You hit a plane.',
                circle:'You hit a rock.', square:'You hit falling debris.',
                comet:'You hit a comet.' };
function zoneAt(f){ let z = ZONES[0]; for (const q of ZONES) if (f >= q.at) z = q; return z; }
function difficulty(f){
  let i = 0;
  for (let k = 0; k < ZONES.length; k++) if (f >= ZONES[k].at) i = k;
  const from = ZONES[i].at;
  const to = (i+1 < ZONES.length) ? ZONES[i+1].at : from + ZONE_TAIL;
  return clamp((i + clamp((f - from)/(to - from), 0, 1)) / (ZONES.length - 1), 0, 1);
}

/* ================================================================
   Canvas - full resolution, no pixel buffer
   ================================================================ */
const stage = document.getElementById('stage');
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function resize(){
  const r = stage.getBoundingClientRect();
  if (!r.width) return;
  const dpr = clamp(window.devicePixelRatio || 1, 1, 3);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  cv.style.width = r.width + 'px';
  cv.style.height = r.height + 'px';
  ctx.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0);
  ctx.lineJoin = 'round';
  stage.style.setProperty('--u', (r.width / W) + 'px');
}
addEventListener('resize', resize, {passive:true});
addEventListener('orientationchange', () => setTimeout(resize, 120), {passive:true});

/* ================================================================
   Sound - four sine blips, nothing more
   ================================================================ */
const Snd = (() => {
  let ac = null, on = true;
  try { on = localStorage.getItem('mad3.mute') !== '1'; } catch(e){}
  const ready = () => {
    if (!on) return null;
    if (!ac){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ac = new A(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  function blip(f, d, v, to){
    const a = ready(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, a.currentTime);
    if (to) o.frequency.exponentialRampToValueAtTime(to, a.currentTime + d);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(v, a.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + d + 0.02);
  }
  return {
    lift(){ blip(180, 0.5, 0.05, 420); },
    tick(){ blip(760, 0.07, 0.04); },
    take(){ blip(560, 0.10, 0.06); setTimeout(()=>blip(840, 0.14, 0.05), 90); },
    boost(){ blip(240, 0.35, 0.06, 900); },
    hurt(){ blip(200, 0.25, 0.07, 90); },
    end(){ blip(300, 0.5, 0.07, 70); setTimeout(()=>blip(150, 0.7, 0.06, 60), 260); },
    flip(){ on = !on; try{ localStorage.setItem('mad3.mute', on?'0':'1'); }catch(e){}
            if (on) blip(660, 0.08, 0.05); return on; },
    get on(){ return on; }
  };
})();
const sndBtn = document.getElementById('snd');
sndBtn.classList.toggle('off', !Snd.on);
sndBtn.addEventListener('click', e => { e.stopPropagation(); sndBtn.classList.toggle('off', !Snd.flip()); sndBtn.blur(); });
sndBtn.addEventListener('pointerdown', e => e.stopPropagation());

let best = 0;
try { best = parseInt(localStorage.getItem('mad3.best') || '0', 10) || 0; } catch(e){}

/* ================================================================
   State
   ================================================================ */
const S = { MENU:0, LIFT:1, RUN:2, CRASH:3, OVER:4 };
let state = S.MENU;
let px = 0, feet = 0, speed = 0, diff = 0, clock = 0, seqT = 0;
let carX = W/2, carVX = 0, carY = STATION, tilt = 0;
let shield = false, mercy = 0, boost = 0;
let spawnT = 0, lastBar = -1e9, lastGap = W/2;
let nextShield = SHIELD_AT, nextBoost = BOOST_AT, nextTick = 100;
let flash = 0, cause = '', shownZone = '';
const things = [];   // hazards and pickups
const ticks  = [];   // floor markers
const marks  = [];   // crash lines

const el = id => document.getElementById(id);
const ui = { hud:el('hud'), alt:el('alt'), best:el('best'), zone:el('zone'),
             pShield:el('pShield'), pBoost:el('pBoost'), title:el('title'),
             over:el('over'), fin:el('fin'), cause:el('cause'), rec:el('rec') };
ui.best.textContent = 'Best ' + commas(best);
if (matchMedia('(hover:none)').matches) el('go').textContent = 'Tap to Start';

/* ================================================================
   Input - arrows, or hold a side of the screen
   ================================================================ */
const keys = { l:false, r:false };
let touching = false, touchX = W/2;
function go(){ if (state === S.MENU || state === S.OVER) start(); }
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A'){ keys.l = true; touching = false; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D'){ keys.r = true; touching = false; e.preventDefault(); }
  if (k === ' ' || k === 'Enter'){ e.preventDefault(); go(); }
  if (k === 'Escape' && state === S.OVER) menu();
  if ((k === 'r' || k === 'R') && (state === S.RUN || state === S.OVER)) start();
  if (k === 'm' || k === 'M') sndBtn.classList.toggle('off', !Snd.flip());
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') keys.l = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
});
const localX = cx => {
  const r = cv.getBoundingClientRect();
  return clamp((cx - r.left) / r.width * W, 0, W);
};
stage.addEventListener('pointerdown', e => {
  if (state === S.RUN || state === S.LIFT){
    touching = true; touchX = localX(e.clientX);
    if (stage.setPointerCapture){ try { stage.setPointerCapture(e.pointerId); } catch(_){} }
  } else if (state !== S.OVER) go();
  e.preventDefault();
});
stage.addEventListener('pointermove', e => { if (touching) touchX = localX(e.clientX); });
const lift = () => { touching = false; };
stage.addEventListener('pointerup', lift);
stage.addEventListener('pointercancel', lift);
stage.addEventListener('pointerleave', lift);
stage.addEventListener('contextmenu', e => e.preventDefault());

/* ================================================================
   Run control
   ================================================================ */
function start(){
  things.length = 0; ticks.length = 0; marks.length = 0;
  scenFill();
  px = 0; feet = 0; speed = 0; diff = 0; seqT = 0; flash = 0;
  carX = W/2; carVX = 0; carY = H + 90; tilt = 0;
  shield = false; mercy = 0; boost = 0;
  spawnT = 2.4; lastBar = -1e9; lastGap = W/2;
  nextShield = SHIELD_AT; nextBoost = BOOST_AT; nextTick = 100;
  cause = ''; shownZone = '';
  state = S.LIFT;
  ui.title.hidden = true; ui.over.hidden = true;
  ui.pShield.classList.remove('on'); ui.pBoost.classList.remove('on');
  ui.hud.classList.remove('on');
  Snd.lift();
}
function menu(){
  state = S.MENU;
  things.length = 0; ticks.length = 0;
  scenFill();
  px = 0; feet = 0; speed = 0; carY = STATION; carX = W/2;
  shield = false; boost = 0; mercy = 0;
  ui.over.hidden = true; ui.title.hidden = false;
  ui.hud.classList.remove('on');
  ui.best.textContent = 'Best ' + commas(best);
}
function results(){
  state = S.OVER;
  const n = Math.floor(feet), rec = n > best;
  if (rec){ best = n; try { localStorage.setItem('mad3.best', String(n)); } catch(e){} }
  ui.fin.textContent = commas(n);
  ui.cause.textContent = cause || 'Out of service.';
  ui.rec.hidden = !rec;
  ui.best.textContent = 'Best ' + commas(best);
  ui.over.hidden = false;
  ui.hud.classList.remove('on');
}
el('again').addEventListener('click', e => { e.stopPropagation(); start(); });
el('menu').addEventListener('click', e => { e.stopPropagation(); menu(); });

/* ================================================================
   The world
   ================================================================ */
function boxes(o){
  switch(o.k){
    case 'bar': return [{ x:-40, y:o.y-11, w:o.gx+40, h:22 },
                        { x:o.gx+o.gw, y:o.y-11, w:W-o.gx-o.gw+40, h:22 }];
    case 'pendulum': return [{ x:o.bx-20, y:o.by-20, w:40, h:40 }];
    case 'capsule':  return [{ x:o.x-100, y:o.y-9, w:200, h:18 }];
    case 'circle': case 'comet': return [{ x:o.x-o.r*0.8, y:o.y-o.r*0.8, w:o.r*1.6, h:o.r*1.6 }];
    case 'square': return [{ x:o.x-o.s*0.5, y:o.y-o.s*0.5, w:o.s, h:o.s }];
    case 'shield': case 'boost': return [{ x:o.x-22, y:o.y-22, w:44, h:44 }];
    default: return [{ x:o.x-20, y:o.y-10, w:40, h:20 }];   /* chevron */
  }
}
const SPAWN = {
  chevron(){ const o = { k:'chevron', x:rnd(60,W-60), y:-40, vy:rnd(20,60),
                         ph:rnd(0,6.3), amp:rnd(20,70), fl:rnd(5,9) }; o.bx = o.x; things.push(o); },
  bar(){
    const gw = lerp(210, 150, diff) * rnd(0.95, 1.06);
    const lo = clamp(lastGap - 230, 14, W - gw - 14), hiX = clamp(lastGap + 230, 14, W - gw - 14);
    const gx = clamp(rnd(lo, hiX), 14, W - gw - 14);
    lastGap = gx + gw/2; lastBar = px;
    things.push({ k:'bar', y:-30, gx, gw, vx:(Math.random()<0.45 ? (Math.random()<0.5?-1:1)*lerp(40,95,diff) : 0), vy:0 });
  },
  pendulum(){
    /* anchored near one wall, with the swing capped so the far side of
       the shaft always keeps a lane the car can actually fit through */
    const d = Math.random() < 0.5 ? 1 : -1;
    const ax = d > 0 ? rnd(110, 190) : W - rnd(110, 190);
    const amp = rnd(0.45, 0.78);
    const room = d > 0 ? (W - 170 - ax) : (ax - 170);
    const len = clamp(rnd(120, 190), 90, Math.max(90, room / Math.max(0.2, Math.sin(amp))));
    things.push({ k:'pendulum', x:ax, y:-190, ax, len, amp,
                  ph:rnd(0,6.3), rate:rnd(1.0,1.7), bx:ax, by:-60, vy:0 });
    lastBar = px;
  },
  capsule(){
    const d = Math.random()<0.5 ? 1 : -1;
    things.push({ k:'capsule', x:d>0?-120:W+120, y:-70, vx:d*rnd(170,260), vy:rnd(20,55), d });
  },
  circle(){ things.push({ k:'circle', x:rnd(50,W-50), y:-70, r:rnd(16,44), sd:rnd(0,6.3),
                          vx:rnd(-60,60), vy:rnd(70,180) }); },
  square(){ things.push({ k:'square', x:rnd(50,W-50), y:-70, s:rnd(24,42),
                          vx:rnd(-60,60), vy:rnd(70,170), rot:rnd(0,6.3), spin:rnd(-1.6,1.6) }); },
  comet(){ const d = Math.random()<0.5?1:-1;
           things.push({ k:'comet', x:d>0?-40:W+40, y:-80, r:17, sd:rnd(0,6.3),
                         vx:d*rnd(240,340), vy:rnd(230,320) }); }
};
const BLOCKER = { bar:1, pendulum:1 };
function spawnOne(){
  const m = zoneAt(feet).mix;
  let total = 0; for (const q of m) total += q[1];
  let r = Math.random()*total, k = m[0][0];
  for (const q of m){ r -= q[1]; if (r <= 0){ k = q[0]; break; } }
  if (BLOCKER[k] && px - lastBar < lerp(700, 430, diff)){
    const small = m.find(q => !BLOCKER[q[0]]);
    if (!small) return;
    k = small[0];
  }
  SPAWN[k]();
}
function pickup(k){
  const o = { k, x:rnd(70,W-70), y:-60, bx:0, ph:rnd(0,6.3), vy:rnd(20,50) };
  o.bx = o.x; things.push(o);
}

/* ================================================================
   Simulation
   ================================================================ */
function carBox(){ return { x:carX-15, y:carY-23, w:30, h:46 }; }
function boostEnv(){
  if (boost <= 0) return 0;
  const t = 1 - boost / BOOST_TIME;
  if (t < 0.16) return ease(t/0.16);
  if (t < 0.62) return 1;
  return 1 - ease((t-0.62)/0.38);
}
function steer(dt, locked){
  if (locked){ carVX *= 0.9; }
  else {
    let d = (keys.r?1:0) - (keys.l?1:0);
    if (touching) d = touchX < W/2 ? -1 : 1;
    if (d) carVX += d * ACCEL * dt;
    else carVX -= carVX * Math.min(1, 9*dt);
    carVX = clamp(carVX, -MAXV, MAXV);
  }
  carX += carVX * dt;
  const lo = CAR_W/2 + PAD, hiX = W - CAR_W/2 - PAD;
  if (carX < lo){ carX = lo; carVX *= -0.2; }
  if (carX > hiX){ carX = hiX; carVX *= -0.2; }
  tilt = Math.round(clamp(carVX/MAXV, -1, 1) * 3) / 3 * 0.10;
}
function crash(what){
  if (state !== S.RUN || mercy > 0 || boost > 0) return;
  if (shield){
    shield = false; mercy = MERCY;
    ui.pShield.classList.remove('on');
    flash = 0.5; Snd.hurt();
    return;
  }
  cause = NAMES[what] || 'Out of service.';
  state = S.CRASH; seqT = 0; flash = 0.55;
  for (let i = 0; i < 7; i++)
    marks.push({ x:carX, y:carY, a:rnd(0,6.3), len:rnd(40,120), t:1 });
  Snd.end();
}
function step(dt, scroll){
  const box = carBox();
  for (let i = things.length-1; i >= 0; i--){
    const o = things[i];
    switch(o.k){
      case 'chevron':
        o.ph += dt*2; o.bx += Math.sin(o.ph*0.3)*12*dt;
        o.x = clamp(o.bx + Math.sin(o.ph)*o.amp, 34, W-34);
        o.fl += dt; break;
      case 'bar':
        if (o.vx){ o.gx += o.vx*dt;
          if (o.gx < 14){ o.gx = 14; o.vx *= -1; }
          if (o.gx > W-o.gw-14){ o.gx = W-o.gw-14; o.vx *= -1; } }
        break;
      case 'pendulum': {
        o.ph += dt*o.rate;
        const a = Math.sin(o.ph)*o.amp;
        o.bx = o.ax + Math.sin(a)*o.len;
        o.by = o.y + Math.cos(a)*o.len;
        break; }
      case 'capsule': case 'comet': o.x += o.vx*dt; break;
      case 'circle': o.x += o.vx*dt;
        if (o.x < 30 || o.x > W-30){ o.vx *= -1; o.x = clamp(o.x,30,W-30); } break;
      case 'square': o.x += o.vx*dt; o.rot += o.spin*dt;
        if (o.x < 30 || o.x > W-30){ o.vx *= -1; o.x = clamp(o.x,30,W-30); } break;
      case 'shield': case 'boost':
        o.ph += dt*1.8; o.x = clamp(o.bx + Math.sin(o.ph)*38, 50, W-50); break;
    }
    o.y += scroll + (o.vy||0)*dt;

    if (state === S.RUN){
      let bump = false;
      for (const b of boxes(o)) if (hit(box, b)){ bump = true; break; }
      if (bump){
        if (o.k === 'shield'){ shield = true; ui.pShield.classList.add('on'); Snd.take(); things.splice(i,1); continue; }
        if (o.k === 'boost'){ boost = BOOST_TIME; ui.pBoost.classList.add('on'); Snd.boost(); things.splice(i,1); continue; }
        crash(o.k);
      }
    }
    const off = o.k === 'bar' ? 60 : o.k === 'pendulum' ? -(o.len+120) : 160;
    if (o.y - off > H) things.splice(i,1);
  }
}

function update(dt){
  clock += dt;

  if (state === S.LIFT){
    seqT += dt;
    const t = clamp(seqT / 1.5, 0, 1);
    carY = lerp(H + 90, STATION, ease(t));
    speed = lerp(0, SPEED_MIN, t);
    px += speed * dt; feet = px * FT_PER_PX;
    steer(dt, t < 0.7);
    if (seqT >= 1.5){ state = S.RUN; seqT = 0; ui.hud.classList.add('on'); }

  } else if (state === S.RUN){
    diff = difficulty(feet);
    const env = boostEnv();
    carY = STATION - env * BOOST_RISE;
    speed = lerp(SPEED_MIN, SPEED_MAX, diff) * (1 + (BOOST_MULT-1) * env);
    if (boost > 0){
      boost = Math.max(0, boost - dt);
      if (!boost){ ui.pBoost.classList.remove('on'); carY = STATION; }
    }
    if (mercy > 0) mercy = Math.max(0, mercy - dt);
    px += speed * dt; feet = px * FT_PER_PX;

    steer(dt, false);
    spawnT -= dt;
    if (spawnT <= 0){ spawnOne(); spawnT = lerp(2.3, 0.46, diff) * rnd(0.85, 1.2); }
    if (feet >= nextShield){ if (!shield) pickup('shield'); nextShield = feet + rnd(3200, 5600); }
    if (feet >= nextBoost){ if (boost <= 0) pickup('boost'); nextBoost = feet + rnd(3600, 6400); }
    while (feet >= nextTick && nextTick <= 2200){
      ticks.push({ y:-20, n:nextTick }); nextTick += 100;
    }
    const z = zoneAt(feet).name;
    if (z !== shownZone){
      shownZone = z;
      ui.zone.textContent = z;
      ui.zone.classList.remove('show'); void ui.zone.offsetWidth; ui.zone.classList.add('show');
      if (feet > 10) Snd.tick();
    }
    ui.alt.childNodes[0].nodeValue = commas(feet);

  } else if (state === S.CRASH){
    seqT += dt;
    speed = Math.max(0, speed - 2600*dt);
    if (seqT >= CURTAIN_AT) ui.hud.classList.remove('on');
    if (seqT >= CRASH_T) results();

  } else if (state === S.MENU){
    speed = 0;
    carY = STATION + Math.sin(clock*1.6)*5;
  }

  const frozen = (state === S.OVER);
  const scroll = frozen ? 0 : speed * dt;
  if (!frozen){
    scenery(state === S.MENU ? 22 * dt : scroll);
    step(dt, scroll);
    for (let i = ticks.length-1; i >= 0; i--){
      ticks[i].y += scroll;
      if (ticks[i].y > H + 30) ticks.splice(i,1);
    }
    for (let i = marks.length-1; i >= 0; i--){
      marks[i].t -= dt * 1.1;
      if (marks[i].t <= 0) marks.splice(i,1);
    }
  }
  flash = Math.max(0, flash - dt * 2.4);
  palette();
}

/* ================================================================
   Scenery. Everything behind the action is built the same way: a
   flat grey, one hard-edged shadow, a black outline. Low down it is
   a city; higher it is cloud decks; above that, worlds.
   ================================================================ */
const scen = [];
const PARA = [0.16, 0.38];          /* parallax, far and near */
const scenGap = [0, 0];
const WIN_ON = '#F6F6F6';

function scenPick(layer){
  const f = feet;
  if (f < 3400)  return (layer === 1 && Math.random() < 0.24) ? 'crane' : 'block';
  if (f < 7600)  return Math.random() < 0.34 ? 'cloud' : 'tower';
  if (f < 13500) return 'cloud';
  return 'orb';
}
function scenSpawn(layer, y0){
  const k = scenPick(layer), far = layer === 0;
  const o = { k, layer, x:0, y:0, cull:200, seed:rndi(0,16) };
  if (k === 'block' || k === 'tower'){
    o.w = (k === 'tower' ? rnd(50, 92) : rnd(84, 158)) * (far ? 0.80 : 1);
    o.h = (k === 'tower' ? rnd(430, 880) : rnd(260, 600)) * (far ? 0.85 : 1);
    o.x = rnd(-o.w*0.35, W - o.w*0.65);
    o.cap = rndi(0, 2);
    o.spire = k === 'tower' ? rnd(34, 96) : 0;
    o.cols = clamp(Math.round(o.w / 30), 2, 5);
    o.y = y0 === undefined ? -o.h - 20 : y0;
    o.cull = 40;
  } else if (k === 'crane'){
    o.d = Math.random() < 0.5 ? 1 : -1;
    o.mh = rnd(210, 340);
    o.jib = rnd(120, 190);
    o.x = o.d > 0 ? rnd(44, 165) : W - rnd(44, 165);
    o.y = y0 === undefined ? -o.mh - 20 : y0;
    o.cull = 40;
  } else if (k === 'cloud'){
    o.puff = [];
    const n = rndi(3, 6), sc = far ? rnd(0.55, 0.80) : rnd(0.80, 1.12);
    let dx = 0;
    for (let i = 0; i < n; i++){
      const r = rnd(26, 46) * sc;
      o.puff.push({ dx, dy:rnd(-11, 11) * sc, r });
      dx += r * rnd(0.68, 1.02);
    }
    o.w = dx; o.h = 60 * sc;
    o.x = rnd(-o.w*0.25, W - o.w*0.62);
    o.y = y0 === undefined ? -120 : y0;
    o.cull = 170;
  } else {                                     /* orb - a moon or a world */
    o.r = rnd(48, 126) * (far ? 0.7 : 1);
    o.x = rnd(o.r*0.25, W - o.r*0.25);
    o.y = y0 === undefined ? -o.r - 60 : y0;
    o.band = Math.random() < 0.4;
    o.cull = o.r + 50;
  }
  scen.push(o);
}
/* gaps are in that layer's own scrolled pixels; roughly (H + prop height)
   over the gap is how many end up on screen at once, so keep them wide */
function scenStep(layer){
  const f = feet;
  if (f > 13500) return rnd(900, 1800);
  if (f > 7600)  return rnd(430, 820);
  return rnd(320, 620) * (layer === 0 ? 1.1 : 1);
}
function scenFill(){
  scen.length = 0;
  for (let l = 0; l < 2; l++){
    const n = feet > 13500 ? 1 : feet > 7600 ? 2 : 4;
    for (let i = 0; i < n; i++) scenSpawn(l, rnd(-260, H - 60));
    scenGap[l] = scenStep(l);
  }
}
function scenery(scroll){
  for (let l = 0; l < 2; l++){
    scenGap[l] -= scroll * PARA[l];
    if (scenGap[l] <= 0){ scenSpawn(l); scenGap[l] = scenStep(l); }
  }
  for (let i = scen.length-1; i >= 0; i--){
    const o = scen[i];
    o.y += scroll * PARA[o.layer];
    if (o.y - o.cull > H) scen.splice(i, 1);
  }
}

/* ================================================================
   Render
   ================================================================ */
function line(x1,y1,x2,y2,w,col){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function dot(x,y,r,col){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }
function ring(x,y,r,w,col){
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.stroke();
}
/* a circle with a hard terminator - the cel shading of every round thing */
function celDisc(x, y, r, base, shade, ow){
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
  ctx.fillStyle = base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = shade;
  ctx.beginPath(); ctx.arc(x + r*0.46, y + r*0.50, r*1.02, 0, 6.2832); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
  ctx.lineWidth = ow || OUTLINE; ctx.strokeStyle = C.ink; ctx.stroke();
}

/* ---- scenery painters ------------------------------------------ */
function drawBlock(o, base, shade, ow, wins){
  if (o.y > H + 8) return;
  const h = Math.max(o.h, H - o.y + 80);
  const band = Math.max(9, o.w*0.26);
  celRect(o.x, o.y, o.w, h, base, shade, band, ow);
  if (o.cap === 1) celRect(o.x + o.w*0.18, o.y - 17, o.w*0.30, 17, base, shade, 6, ow);
  if (o.cap === 2){
    celRect(o.x + o.w*0.30, o.y - 13, o.w*0.40, 13, base, shade, 5, ow);
    line(o.x + o.w*0.5, o.y - 13, o.x + o.w*0.5, o.y - 42, ow, C.ink);
  }
  if (o.spire) line(o.x + o.w/2, o.y, o.x + o.w/2, o.y - o.spire, ow, C.ink);
  if (!wins){                                  /* far facades get floor lines */
    ctx.fillStyle = shade;
    const fw = o.w - band - ow*2 - 8;
    if (fw < 12) return;
    const fc = clamp(Math.round(fw / 22), 1, 4), fcw = fw / fc;
    for (let r = 0, wy = o.y + 32; wy < H && r < 40; r++, wy += 44){
      if (wy < -10) continue;
      for (let c = 0; c < fc; c++)
        ctx.fillRect(o.x + ow + 4 + c*fcw + fcw*0.22, wy, fcw*0.52, 11);
    }
    return;
  }
  const gx = o.x + ow + 5, gw = o.w - band - ow - 9;
  if (gw < 14) return;
  const cw = gw / o.cols, ww = Math.min(cw*0.56, 13);
  for (let r = 0, wy = o.y + 18; wy < H && r < 40; r++, wy += 34){
    if (wy < -16) continue;
    for (let c = 0; c < o.cols; c++){
      ctx.fillStyle = ((r*5 + c*3 + o.seed) % 17) === 0 ? WIN_ON : C.ink;
      ctx.fillRect(gx + c*cw + (cw-ww)/2, wy, ww, 13);
    }
  }
}
function drawCrane(o, base, shade, ow){
  if (o.y > H + 8) return;
  const x = o.x, y = o.y;
  const mh = Math.max(o.mh, H - y + 60);
  celRect(x - 8, y, 16, mh, base, shade, 5, ow);
  for (let i = 1; i*46 < mh; i++){
    const ly = y + i*46;
    if (ly > H + 20) break;
    line(x - 8, ly, x + 8, ly - 22, 2, C.ink);
  }
  const jx = o.d > 0 ? x - 28 : x - o.jib;
  celRect(jx, y - 6, o.jib + 28, 13, base, shade, 7, ow);
  celRect(o.d > 0 ? x - 44 : x + 20, y - 15, 24, 22, base, shade, 6, ow);   /* counterweight */
  const hx0 = x + o.d * o.jib * 0.66;
  line(hx0, y + 7, hx0, y + 58, 2, C.ink);
  celRect(hx0 - 10, y + 58, 20, 15, base, shade, 6, ow);
}
function drawCloud(o, base, shade, ow){
  const p = o.puff;
  ctx.fillStyle = '#2B2B2B';
  ctx.beginPath();
  for (const q of p) ctx.arc(o.x + q.dx, o.y + q.dy, q.r + 3, 0, 6.2832);
  ctx.fill();
  ctx.beginPath();
  for (const q of p) ctx.arc(o.x + q.dx, o.y + q.dy, q.r, 0, 6.2832);
  ctx.fillStyle = base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = shade;
  ctx.fillRect(o.x - 260, o.y + o.h*0.14, W + 520, 420);
  ctx.restore();
}
function drawOrb(o, base, shade, ow){
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.2832);
  ctx.fillStyle = base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = shade;
  ctx.beginPath(); ctx.arc(o.x + o.r*0.36, o.y + o.r*0.40, o.r*0.99, 0, 6.2832); ctx.fill();
  if (o.band){
    ctx.fillRect(o.x - o.r, o.y - o.r*0.56, o.r*2, o.r*0.13);
    ctx.fillRect(o.x - o.r, o.y - o.r*0.18, o.r*2, o.r*0.18);
  } else {
    for (let i = 0; i < 3; i++){
      const a = o.seed + i*2.3;
      ctx.beginPath();
      ctx.arc(o.x + Math.cos(a)*o.r*0.42 - o.r*0.16,
              o.y + Math.sin(a)*o.r*0.42 - o.r*0.16, o.r*0.11, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.2832);
  ctx.lineWidth = 3; ctx.strokeStyle = OR_EDGE; ctx.stroke();
}
function drawScen(layer){
  const far = layer === 0;
  const base = far ? C.far : C.near, shade = far ? C.farS : C.nearS;
  const ow = far ? 3 : 4;
  for (const o of scen){
    if (o.layer !== layer) continue;
    if (o.k === 'block' || o.k === 'tower') drawBlock(o, base, shade, ow, !far);
    else if (o.k === 'crane') drawCrane(o, base, shade, ow);
    else if (o.k === 'cloud') drawCloud(o, CL_FILL, CL_SHADE, ow);
    else drawOrb(o, OR_FILL, OR_SHADE, 3);
  }
}
function drawStars(){
  const a = clamp((feet - 9200) / 3800, 0, 1);
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = INK_LIGHT;
  for (let i = 0; i < 64; i++){
    const sx = (i * 97.31) % (W - 8) + 4;
    const sy = ((i * 173.77 + px * 0.06) % (H + 40)) - 20;
    const s = (i % 9 === 0) ? 5 : (i % 3 === 0) ? 3 : 2;
    ctx.fillRect(sx | 0, sy | 0, s, s);
  }
  ctx.restore();
}

/* letter-spaced centred canvas type, to match the HUD */
function spaced(text, cx, cy, size, gap, col){
  ctx.font = '400 ' + size + 'px ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const ws = [];
  let w = 0;
  for (let i = 0; i < text.length; i++){
    const m = ctx.measureText(text[i]).width;
    ws.push(m); w += m + gap;
  }
  w -= gap;
  let x = cx - w/2;
  ctx.fillStyle = col;
  for (let i = 0; i < text.length; i++){ ctx.fillText(text[i], x, cy); x += ws[i] + gap; }
}
function drawCurtain(){
  const t = seqT;
  if (t > CURTAIN_AT){
    const p = clamp((t - CURTAIN_AT) / CURTAIN_T, 0, 1);
    const h = H * ease(p);
    ctx.fillStyle = RED;
    ctx.fillRect(0, 0, W, h);
    ctx.fillStyle = INK_DARK;
    ctx.fillRect(0, h - 7, W, 7);
    if (p > 0.5){
      ctx.save();
      ctx.globalAlpha = clamp((p - 0.5) / 0.32, 0, 1);
      spaced('GAME OVER', W/2, Math.min(h*0.46, H*0.40), 46, 13, INK_LIGHT);
      ctx.restore();
    }
  }
  if (t > BLACK_AT){
    ctx.save();
    ctx.globalAlpha = clamp((t - BLACK_AT) / (CRASH_T - BLACK_AT), 0, 1);
    ctx.fillStyle = '#090909';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function drawShaft(){
  const fade = clamp(1 - (feet - 1500) / 900, 0, 1);
  if (fade <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = fade * 0.8;
  line(26, 0, 26, H, 2, C.dim);
  line(W-26, 0, W-26, H, 2, C.dim);
  ctx.font = '400 13px ui-sans-serif, system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  for (const t of ticks){
    if (t.y < -20 || t.y > H + 20) continue;
    line(26, t.y, 54, t.y, 2, C.dim);
    line(W-54, t.y, W-26, t.y, 2, C.dim);
    ctx.fillStyle = C.dim;
    ctx.textAlign = 'left';
    ctx.fillText(t.n, 62, t.y);
  }
  ctx.restore();
}
function drawSpeed(){
  const a = clamp((speed - 380) / 460, 0, 1) * 0.34;
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = a;
  for (let i = 0; i < 9; i++){
    const x = ((i*127.3 + (px*0.9) % 900) % (W-140)) + 70;
    const y = ((i*233.1 + px*1.7) % (H+260)) - 130;
    line(x, y, x, y + 70 + a*220, 3, C.dim);
  }
  ctx.restore();
}

/* ---- hazards --------------------------------------------------- */
function birdPath(o, d){
  const x = o.x, y = o.y;
  ctx.beginPath();
  ctx.moveTo(x - 34, y - d);
  ctx.lineTo(x - 12, y + 3);
  ctx.lineTo(x,      y - 4);
  ctx.lineTo(x + 12, y + 3);
  ctx.lineTo(x + 34, y - d);
  ctx.lineTo(x + 26, y - d*0.30);
  ctx.lineTo(x + 10, y + 12);
  ctx.lineTo(x,      y + 6);
  ctx.lineTo(x - 10, y + 12);
  ctx.lineTo(x - 26, y - d*0.30);
  ctx.closePath();
}
function planePath(o){
  const d = o.d;
  const P = [[104,0],[62,-11],[-26,-13],[-50,-34],[-66,-34],[-60,-13],[-98,-10],
             [-98,10],[-60,13],[-14,13],[4,38],[19,38],[15,13],[62,11]];
  ctx.beginPath();
  for (let i = 0; i < P.length; i++){
    const x = o.x + P[i][0]*d, y = o.y + P[i][1];
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function rockPath(o){
  const n = 9;
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    const a = i / n * 6.2832;
    const rr = o.r * (0.80 + 0.22 * Math.abs(Math.sin(o.sd + i*2.37)));
    const x = o.x + Math.cos(a)*rr, y = o.y + Math.sin(a)*rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function panelPath(s){
  const h = s/2;
  ctx.beginPath();
  ctx.moveTo(-h, -h + 7);
  ctx.lineTo(-h + 7, -h);
  ctx.lineTo(h, -h);
  ctx.lineTo(h, h - 7);
  ctx.lineTo(h - 7, h);
  ctx.lineTo(-h, h);
  ctx.closePath();
}

function drawThing(o){
  const ink = C.ink, fill = C.fill, shade = C.shade;
  switch(o.k){
    case 'chevron': {
      /* a bird is the one thing lit from behind: dark body, bright top edge */
      const d = 14 + Math.sin(o.fl*7)*8;
      const build = () => birdPath(o, d);
      ctx.save();
      build(); ctx.fillStyle = shade; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(o.x - 60, o.y - d*0.15);
      ctx.lineTo(o.x + 60, o.y - d*0.55);
      ctx.lineTo(o.x + 60, o.y - 80);
      ctx.lineTo(o.x - 60, o.y - 80);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      build(); ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.stroke();
      ctx.restore();
      break; }
    case 'bar': {
      const y = o.y - 13, h = 26;
      if (o.gx > 0) celBar(-44, y, o.gx + 44, h, fill, shade);
      if (o.gx + o.gw < W) celBar(o.gx + o.gw, y, W - o.gx - o.gw + 44, h, fill, shade);
      /* the gap is the one friendly thing on screen, so it gets the red */
      ctx.fillStyle = RED;
      ctx.fillRect(o.gx - 11, y - 5, 11, h + 10);
      ctx.fillRect(o.gx + o.gw, y - 5, 11, h + 10);
      ctx.lineWidth = 3; ctx.strokeStyle = ink;
      ctx.strokeRect(o.gx - 11 + 1.5, y - 3.5, 8, h + 7);
      ctx.strokeRect(o.gx + o.gw + 1.5, y - 3.5, 8, h + 7);
      break; }
    case 'pendulum':
      line(o.ax, o.y, o.bx, o.by, 3, ink);
      celRect(o.ax - 15, o.y - 9, 30, 14, fill, shade, 8);
      celDisc(o.bx, o.by, 21, fill, shade);
      break;
    case 'capsule':
      cel(() => planePath(o), fill, shade, o.x, o.y, 200, 74);
      ctx.fillStyle = ink;
      for (let i = 0; i < 5; i++) ctx.fillRect(o.x - 56 + i*26, o.y - 4, 11, 7);
      break;
    case 'circle':
      cel(() => rockPath(o), fill, shade, o.x, o.y, o.r*2, o.r*2);
      ctx.save();
      rockPath(o); ctx.clip();
      ctx.fillStyle = shade;
      for (let i = 0; i < 3; i++){
        ctx.beginPath();
        ctx.arc(o.x + Math.cos(o.sd + i*2.1)*o.r*0.42,
                o.y + Math.sin(o.sd + i*2.1)*o.r*0.42, o.r*0.17, 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
      break;
    case 'square':
      ctx.save();
      ctx.translate(o.x, o.y); ctx.rotate(o.rot);
      cel(() => panelPath(o.s), fill, shade, 0, 0, o.s, o.s);
      ctx.fillStyle = ink;
      ctx.fillRect(-o.s*0.3, -o.s*0.06, o.s*0.6, 4);
      ctx.restore();
      break;
    case 'comet': {
      const m = Math.hypot(o.vx, o.vy) || 1;
      const ux = -o.vx/m, uy = -o.vy/m;
      ctx.save();
      line(o.x + ux*150, o.y + uy*150, o.x, o.y, 5, C.dim);
      ctx.globalAlpha = 0.7;
      for (let i = 1; i <= 4; i++){
        const t = i * 40;
        dot(o.x + ux*t, o.y + uy*t, o.r * (1 - i*0.20), C.dim);
      }
      ctx.restore();
      celDisc(o.x, o.y, o.r, fill, shade);
      break; }
    case 'shield':
      celDisc(o.x, o.y, 19, RED, RED_LO);
      ring(o.x, o.y, 9, 3, INK_LIGHT);
      break;
    case 'boost': {
      const tri = () => {
        ctx.beginPath();
        ctx.moveTo(o.x, o.y - 21);
        ctx.lineTo(o.x + 18, o.y + 13);
        ctx.lineTo(o.x - 18, o.y + 13);
        ctx.closePath();
      };
      cel(tri, RED, RED_LO, o.x, o.y, 40, 36);
      ctx.fillStyle = INK_LIGHT;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y - 9); ctx.lineTo(o.x + 8, o.y + 6); ctx.lineTo(o.x - 8, o.y + 6);
      ctx.closePath(); ctx.fill();
      break; }
  }
}

/* ---- the car --------------------------------------------------- */
function carPath(){
  const w = CAR_W, h = CAR_H, hw = w/2, hh = h/2;
  ctx.beginPath();
  ctx.moveTo(-hw, -hh + 7);
  ctx.lineTo(-hw + 7, -hh);
  ctx.lineTo(hw - 7, -hh);
  ctx.lineTo(hw, -hh + 7);
  ctx.lineTo(hw, hh - 5);
  ctx.lineTo(hw - 6, hh);
  ctx.lineTo(-hw + 6, hh);
  ctx.lineTo(-hw, hh - 5);
  ctx.closePath();
}
function drawCar(){
  const blink = mercy > 0 && (Math.floor(mercy*12) % 2 === 0);
  const env = boostEnv();
  const bub = shield || mercy > 0;

  if (bub){                       /* a solid red bubble, car white inside */
    ctx.save();
    ctx.globalAlpha = shield ? 1 : 0.45;
    const r = 44 + Math.sin(clock*3)*1.6;
    ctx.beginPath(); ctx.arc(carX, carY, r, 0, 6.2832);
    ctx.fillStyle = RED; ctx.fill();
    ctx.lineWidth = OUTLINE; ctx.strokeStyle = C.ink; ctx.stroke();
    ctx.restore();
  }
  if (blink) return;

  ctx.save();
  ctx.translate(carX, carY);
  if (tilt) ctx.rotate(tilt);

  /* exhaust */
  const plume = 16 + env*66 + clamp((speed-SPEED_MIN)/(SPEED_MAX-SPEED_MIN),0,1)*22;
  ctx.beginPath();
  ctx.moveTo(-7, CAR_H/2 + 2);
  ctx.lineTo(7, CAR_H/2 + 2);
  ctx.lineTo(0, CAR_H/2 + 2 + plume);
  ctx.closePath();
  ctx.fillStyle = shield ? INK_LIGHT : RED; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-3, CAR_H/2 + 2);
  ctx.lineTo(3, CAR_H/2 + 2);
  ctx.lineTo(0, CAR_H/2 + 2 + plume*0.62);
  ctx.closePath();
  ctx.fillStyle = shield ? RED : RED_HI; ctx.fill();

  if (shield){
    carPath(); ctx.fillStyle = INK_LIGHT; ctx.fill();       /* silhouette */
  } else {
    cel(carPath, RED, RED_LO, 0, 0, CAR_W, CAR_H);
    /* glass front */
    const gw = CAR_W - 14, gh = 20;
    ctx.fillStyle = INK_LIGHT;
    ctx.fillRect(-gw/2, -CAR_H/2 + 9, gw, gh);
    ctx.fillStyle = C.dim;
    ctx.beginPath();
    ctx.moveTo(gw/2, -CAR_H/2 + 9);
    ctx.lineTo(gw/2, -CAR_H/2 + 9 + gh);
    ctx.lineTo(gw/2 - gh*0.9, -CAR_H/2 + 9 + gh);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = C.ink;
    ctx.strokeRect(-gw/2 + 1.5, -CAR_H/2 + 10.5, gw - 3, gh - 3);
    /* door seam and sill */
    ctx.fillStyle = RED_LO;
    ctx.fillRect(-CAR_W/2 + 4, CAR_H/2 - 13, CAR_W - 8, 3);
    ctx.fillStyle = C.ink;
    ctx.fillRect(-1.5, -CAR_H/2 + 33, 3, 17);
  }
  ctx.restore();
}

function draw(){
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (state === S.CRASH && seqT < JIG_T){
    const k = 1 - seqT / JIG_T;
    ctx.translate(Math.sin(seqT*130) * 12 * k, Math.cos(seqT*101) * 9 * k);
  }
  drawStars();
  drawScen(0);
  drawShaft();
  drawScen(1);
  drawSpeed();
  for (const o of things) drawThing(o);
  if (state !== S.OVER) drawCar();
  for (const m of marks){
    ctx.save();
    ctx.globalAlpha = clamp(m.t, 0, 1);
    const g = (1 - m.t) * m.len;
    line(m.x + Math.cos(m.a)*g, m.y + Math.sin(m.a)*g,
         m.x + Math.cos(m.a)*(g+26), m.y + Math.sin(m.a)*(g+26), 4, RED);
    ctx.restore();
  }
  ctx.restore();
  if (flash > 0.01){
    ctx.save();
    ctx.globalAlpha = clamp(flash, 0, 1) * 0.9;
    ctx.fillStyle = RED;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (state === S.CRASH) drawCurtain();
}

/* ================================================================
   Loop
   ================================================================ */
let last = performance.now();
function frame(t){
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();
palette();
scenFill();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
